    <title>Web GUI with TypeScript</title>
    <link rel="stylesheet" href="src/style.css">
    <style>
      /* unsichtbare Tabelle in #actions-display */
      .actions-table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
      }

      .actions-table th, .actions-table td {
        padding: 8px 4px;
        text-align: left;
        vertical-align: top; /* Inhalte oben ausrichten */
        border: none; /* Unsichtbare Ränder */
        word-wrap: break-word; /* Textumbruch in den Zellen */
      }

      /* NEU: Flexbox für die erste Spalte, um Umbruch zu verhindern */
      .actions-table td:first-child {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      /* Spaltenbreiten definieren */
      .actions-table col.col-1 { width: 15%; } /* Timestamp (noch schmaler) */
      .actions-table col.col-2 { width: 60%; }  /* Recommended Action */
      .actions-table col.col-3 { width: 25%; } /* Interaction */
    </style>
  </head>

            <div class="timer-row">
              <!-- Das unsichtbare, funktionale Input-Feld -->
              <input type="datetime-local" id="alert-start" name="alert-start" step="1" class="visually-hidden">
              <!-- Das sichtbare Anzeige-Feld, das auf Klicks reagiert -->
              <input type="text" id="alert-start-display" class="timer-input" readonly>
            </div>
            <div class="elapsed-wrap">
              <span class="elapsed-label">Time Elapsed:</span>
              <span id="elapsed-time" class="elapsed-display">00:00:00</span>
            </div>
          </div>
